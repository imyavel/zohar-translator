<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zohar-translator</title>
  <meta name="description" content="Long-form LLM translation system. Auto-detects locale; choose manually from the menu after redirect.">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var LANGS = ['ru','en','zh','es','pt','ja','de','ko','fr','it','tr','lt','he'];
      var COUNTRY_MAP = {
        CN:'zh', HK:'zh', TW:'zh', SG:'zh', MO:'zh',
        ES:'es', MX:'es', AR:'es', CO:'es', PE:'es', CL:'es', VE:'es', EC:'es',
        GT:'es', CU:'es', BO:'es', DO:'es', HN:'es', PY:'es', SV:'es', NI:'es',
        CR:'es', PA:'es', UY:'es', PR:'es',
        BR:'pt', PT:'pt', AO:'pt', MZ:'pt',
        JP:'ja',
        DE:'de', AT:'de', CH:'de', LI:'de',
        KR:'ko',
        FR:'fr', BE:'fr', LU:'fr', MC:'fr',
        IT:'it', SM:'it', VA:'it',
        TR:'tr', CY:'tr',
        LT:'lt',
        IL:'he',
        RU:'ru', BY:'ru', KZ:'ru', UA:'ru', KG:'ru'
      };

      function pickLang(country) {
        if (country && COUNTRY_MAP[country]) return COUNTRY_MAP[country];
        var nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
        if (LANGS.indexOf(nav) !== -1) return nav;
        return 'en';
      }
      function go(lang) {
        if (LANGS.indexOf(lang) === -1) lang = 'en';
        location.replace('./' + lang + '/');
      }

      try {
        var stored = localStorage.getItem('lang');
        if (stored && LANGS.indexOf(stored) !== -1) { go(stored); return; }
      } catch (_) { /* localStorage disabled — fall through */ }

      var done = false;
      var timer = setTimeout(function () {
        if (done) return; done = true;
        go(pickLang(null));
      }, 1500);

      fetch('https://www.cloudflare.com/cdn-cgi/trace', { cache: 'no-store' })
        .then(function (r) { return r.text(); })
        .then(function (text) {
          if (done) return; done = true; clearTimeout(timer);
          var m = text.match(/loc=([A-Z]{2})/);
          go(pickLang(m ? m[1] : null));
        })
        .catch(function () {
          if (done) return; done = true; clearTimeout(timer);
          go(pickLang(null));
        });
    })();
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>zohar-translator</h1>
      <p class="tagline">Detecting your language… If nothing happens, pick one:</p>
    </header>
    <nav class="lang-switcher" aria-label="Language selection">
      <a href="./ru/" data-lang="ru">Русский</a>
      <a href="./en/" data-lang="en">English</a>
      <a href="./zh/" data-lang="zh">中文</a>
      <a href="./es/" data-lang="es">Español</a>
      <a href="./pt/" data-lang="pt">Português</a>
      <a href="./ja/" data-lang="ja">日本語</a>
      <a href="./de/" data-lang="de">Deutsch</a>
      <a href="./ko/" data-lang="ko">한국어</a>
      <a href="./fr/" data-lang="fr">Français</a>
      <a href="./it/" data-lang="it">Italiano</a>
      <a href="./tr/" data-lang="tr">Türkçe</a>
      <a href="./lt/" data-lang="lt">Lietuvių</a>
      <a href="./he/" data-lang="he">עברית</a>
    </nav>
  </div>
  <script src="lang.js" defer></script>
</body>
</html>

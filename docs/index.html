  <script>
    (function () {
      var LANGS = ['ru','en','zh','es','pt','ja','de','ko','fr','it','tr','lt','he'];
      var COUNTRY_MAP = {
        CN:'zh', HK:'zh', TW:'zh', SG:'zh', MO:'zh',
        ES:'es', MX:'es', AR:'es', CO:'es', PE:'es', CL:'es', VE:'es', EC:'es',
        GT:'es', CU:'es', BO:'es', DO:'es', HN:'es', PY:'es', SV:'es', NI:'es',
        CR:'es', PA:'es', UY:'es', PR:'es',
        BR:'pt', PT:'pt', AO:'pt', MZ:'pt',
        JP:'ja',
        DE:'de', AT:'de', CH:'de', LI:'de',
        KR:'ko',
        FR:'fr', BE:'fr', LU:'fr', MC:'fr',
        IT:'it', SM:'it', VA:'it',
        TR:'tr', CY:'tr',
        LT:'lt',
        IL:'he',
        RU:'ru', BY:'ru', KZ:'ru', UA:'ru', KG:'ru'
      };

      // Country found via geo-IP: country in COUNTRY_MAP → its language;
      // any other country (incl. US/UK/AU/NZ/IN/PH/…) → English by default.
      function pickLangByCountry(country) {
        return COUNTRY_MAP[country] || 'en';
      }
      // Browser locale — only when geo-IP failed entirely (timeout/error).
      function pickLangByBrowser() {
        var nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
        return LANGS.indexOf(nav) !== -1 ? nav : 'en';
      }
      function go(lang) {
        if (LANGS.indexOf(lang) === -1) lang = 'en';
        location.replace('./' + lang + '/');
      }

      try {
        var stored = localStorage.getItem('lang');
        if (stored && LANGS.indexOf(stored) !== -1) { go(stored); return; }
      } catch (_) { /* localStorage disabled — fall through */ }

      var done = false;
      var timer = setTimeout(function () {
        if (done) return; done = true;
        go(pickLangByBrowser());
      }, 1500);

      fetch('https://www.cloudflare.com/cdn-cgi/trace', { cache: 'no-store' })
        .then(function (r) { return r.text(); })
        .then(function (text) {
          if (done) return; done = true; clearTimeout(timer);
          var m = text.match(/loc=([A-Z]{2})/);
          go(m ? pickLangByCountry(m[1]) : pickLangByBrowser());
        })
        .catch(function () {
          if (done) return; done = true; clearTimeout(timer);
          go(pickLangByBrowser());
        });
    })();
  </script>
